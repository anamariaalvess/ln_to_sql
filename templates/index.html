<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Natural Language to SQL</title>

    <link
        rel="stylesheet"
        type="text/css"
        href="{{ url_for('static', path='/style.css') }}"
    >
</head>

<body>

    <div class="container">

        <h1>Natural Language to SQL</h1>

        <p>
            Converta perguntas em linguagem natural
            para consultas SQL utilizando IA Generativa.
        </p>

        <form method="post" action="/question">

            <div>
                <label for="input-text">
                    Pergunta:
                </label>

                <textarea
                    id="input-text"
                    name="input_text"
                    rows="4"
                    cols="50"
                    placeholder="Ex.: Qual cliente possui o maior valor faturado?"
                >{{ input_text }}</textarea>
            </div>

            <button type="submit">
                Gerar SQL
            </button>

        </form>


        {% if error_message %}

        <div class="error">
            {{ error_message }}
        </div>

        {% endif %}


        {% if sql_query %}

        <div>
            <label for="sql-text">
                Consulta SQL gerada:
            </label>

            <textarea
                id="sql-text"
                class="result"
                rows="8"
                cols="50"
                readonly
            >{{ sql_query }}</textarea>
        </div>

        {% endif %}

    </div>

</body>

</html>
